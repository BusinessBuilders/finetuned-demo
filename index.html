<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fine-Tuned Business Solutions Inc. — Sample site by Business Builders</title>
  <link rel="stylesheet" href="colors_and_type.css" />
  <link rel="stylesheet" href="site.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="NavBar.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Features.jsx"></script>
  <script type="text/babel" src="Pricing.jsx"></script>
  <script type="text/babel" src="FAQ.jsx"></script>
  <script type="text/babel" src="Contact.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [picked, setPicked] = useState(null);
      const [toast, setToast] = useState(null);
      const toastTimer = useRef();

      function handlePick(tier) {
        setPicked(tier.name);
        setToast(`${tier.name} selected — fill in the form below.`);
        clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(null), 2600);
        document.getElementById("contact")?.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      // Re-render icons whenever React updates the DOM
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      return (
        <>
          <NavBar onPick={() => {}} />
          <main>
            <Hero />
            <Features />
            <Pricing onPick={handlePick} />
            <FAQ />
            <Contact selectedTier={picked} />
          </main>
          <Footer />
          {toast && (
            <div className="toast"><i data-lucide="check"></i><span>{toast}</span></div>
          )}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
